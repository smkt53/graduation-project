<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>UIレイアウト骨格</title>
  <style>
    /* 1. 画面全体を横並び（縦に3分割）にする設定 */
    body {
      display: flex;       /* 子要素を横並びに配置 */
      height: 100vh;       /* 画面の高さ100%を使う */
      margin: 0;           /* ブラウザ標準の余白を消す */
      overflow: hidden;     /* 画面外のスクロールを消す */
    }

    /* 2. 左ペイン（履歴） */
    .left {
      width: 10%;          /* 幅10% */
      background-color: #f0f0f0;
      border-right: 1px solid #ccc;
      overflow: auto;
    }

    /* 3. 中央ペイン（コード表示と入力欄の親箱） */
    .center {
      width: 60%;          /* 幅60% */
      display: flex;       /* この中もflexにする */
      flex-direction: column; /* 中身は「縦並び（上下分割）」にする */
    }

    /* 3-1. 中央上（コード表示エリア） */
    .code-area {
      flex: 1;             /* 下の入力欄以外の残りの高さをすべて使う */
      background-color: #222;
      color: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .code-area pre {
      flex: 1;
      overflow: auto;
      margin: 0;
      padding: 10px;
    }

    /* 3-2. 中央下（クエリ入力エリア） */
    .input-area {
      height: 100px;       /* 高さ100pxで固定 */
      background-color: #fff;
      border-top: 1px solid #ccc;
      flex-shrink: 0;
      display: flex;
      padding: 0;
    }

    #query-input {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      padding: 10px;
      font-size: 14px;
      font-family: inherit;
    }

    #send-button {
      width: 80px;
      border: none;
      border-left: 1px solid #ccc;
      background-color: #007bff;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    #send-button:hover {
      background-color: #0056b3;
    }
    

    /* 4. 右ペイン（ドキュメント表示） */
    .right {
      width: 30%;
      background-color: #f9f9f9;
      border-left: 1px solid #ccc;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #api-detail-container {
      flex: 1;
      overflow: auto;
      padding: 10px;
    }

    .right h3, #radio-tab-container {
      padding: 10px;
      margin: 0;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- 左ペイン -->
  <div class="left">
    プロジェクト（履歴）
  </div>

  <!-- 中央ペイン -->
  <div class="center">
    <div class="code-area">
      サンプルコード表示
      <pre id="code-display"></pre>
    </div>
    <div class="input-area">
      <textarea id="query-input" placeholder="クエリを入力してください"></textarea>
      <button id="send-button">送信</button>
    </div>
  </div>

  <!-- 右ペイン -->
  <div class="right">
    <h3>パラメータ情報</h3>
    <div id="radio-tab-container" style="display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap;"></div>
    <div id="api-detail-container">
      <div id="endpoint-display" style="font-weight: bold; margin-bottom: 8px; color: #333;"></div>
      <pre><code id="parameters-display" style="white-space: pre-wrap;"></code></pre>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
